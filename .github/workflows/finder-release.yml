name: FinderSpan Windows Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/Apply-FinderUi*.ps1'
      - '.github/workflows/finder-release.yml'
      - 'src/Span/**'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Apply FinderSpan UI patch
        shell: pwsh
        run: ./tools/Apply-FinderUi-CI.ps1

      - name: Validate real FinderSpan integrations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $xamlPath = Join-Path $env:GITHUB_WORKSPACE 'src\Span\Span\MainWindow.xaml'
          $chromePath = Join-Path $env:GITHUB_WORKSPACE 'src\Span\Span\MainWindow.FinderChrome.cs'
          $xaml = Get-Content -LiteralPath $xamlPath -Raw
          $chrome = Get-Content -LiteralPath $chromePath -Raw

          if ($xaml.Contains('OnFinderTagClick')) {
            throw 'Decorative Finder Tags handlers are still present in generated XAML.'
          }
          if ($xaml.Contains('Text="AirDrop"')) {
            throw 'Fake AirDrop entry is still present in generated XAML.'
          }

          foreach ($required in @(
            'x:Name="FinderQuickShareButton"',
            'x:Name="FinderQuickShareSidebarItem"',
            'Tapped="OnFinderQuickShareSidebarTapped"',
            'x:Name="FavoritesFlatList"'
          )) {
            if (-not $xaml.Contains($required)) {
              throw "FinderSpan integration validation failed. Missing XAML marker: $required"
            }
          }

          foreach ($required in @(
            'FindQuickShareTarget()',
            'FinderQuickShareSidebarItem.Visibility = visibility',
            'OnFinderQuickShareSidebarTapped'
          )) {
            if (-not $chrome.Contains($required)) {
              throw "FinderSpan integration validation failed. Missing code marker: $required"
            }
          }

          Write-Host 'FinderSpan integration validation passed: real sidebar retained, fake AirDrop/Tags removed, Quick Share wired.'

      - name: Set rolling package version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'src\Span\Span\Package.appxmanifest'
          $version = "2.0.${{ github.run_number }}.0"

          [xml]$manifest = Get-Content -LiteralPath $manifestPath -Raw
          $identity = $manifest.Package.Identity
          if ($null -eq $identity) {
            throw 'Package.appxmanifest does not contain Identity.'
          }
          $identity.SetAttribute('Version', $version)

          $xmlSettings = [System.Xml.XmlWriterSettings]::new()
          $xmlSettings.Encoding = [System.Text.UTF8Encoding]::new($false)
          $xmlSettings.Indent = $true
          $xmlSettings.NewLineChars = "`r`n"
          $xmlSettings.NewLineHandling = [System.Xml.NewLineHandling]::Replace
          $writer = [System.Xml.XmlWriter]::Create($manifestPath, $xmlSettings)
          try {
            $manifest.Save($writer)
          }
          finally {
            $writer.Dispose()
          }

          [xml]$verify = Get-Content -LiteralPath $manifestPath -Raw
          if ($verify.Package.Identity.Version -ne $version) {
            throw "Manifest version verification failed. Expected $version, got '$($verify.Package.Identity.Version)'."
          }
          if ([string]::IsNullOrWhiteSpace($verify.Package.Identity.Publisher)) {
            throw 'Manifest publisher was lost while updating the version.'
          }
          Write-Host "FinderSpan package version: $version"

      - name: Create FinderSpan development signing certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\dist" | Out-Null

          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'src\Span\Span\Package.appxmanifest'
          [xml]$packageManifest = Get-Content -LiteralPath $manifestPath
          $publisher = $packageManifest.Package.Identity.Publisher
          if ([string]::IsNullOrWhiteSpace($publisher)) {
            throw 'Package.appxmanifest does not contain Identity Publisher.'
          }
          Write-Host "Creating development certificate for MSIX publisher: $publisher"

          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject $publisher `
            -FriendlyName 'FinderSpan Development Signing' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -KeyExportPolicy Exportable `
            -KeyUsage DigitalSignature `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3')

          if ($cert.Subject -ne $publisher) {
            throw "Signing certificate subject '$($cert.Subject)' does not match manifest publisher '$publisher'."
          }

          $pfxPasswordText = [Guid]::NewGuid().ToString('N')
          Write-Host "::add-mask::$pfxPasswordText"
          $pfxPassword = ConvertTo-SecureString -String $pfxPasswordText -Force -AsPlainText
          $pfxPath = Join-Path $env:GITHUB_WORKSPACE 'src\Span\Span\FinderSpan_CI.pfx'
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $pfxPassword | Out-Null
          Export-Certificate -Cert $cert -FilePath "$env:GITHUB_WORKSPACE\dist\FinderSpan-Dev.cer" | Out-Null
          "FINDERSPAN_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FINDERSPAN_PFX_PASSWORD=$pfxPasswordText" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build signed x64 MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\dist\msix" | Out-Null
          $msbuildLog = Join-Path $env:GITHUB_WORKSPACE 'msbuild.log'
          msbuild src\Span\Span\Span.csproj /restore /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:SelfContained=true `
            /p:PublishTrimmed=false `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxBundle=Never `
            /p:PackageCertificateKeyFile=FinderSpan_CI.pfx `
            /p:PackageCertificatePassword=$env:FINDERSPAN_PFX_PASSWORD `
            /p:PackageCertificateThumbprint=$env:FINDERSPAN_CERT_THUMBPRINT `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE\dist\msix\" `
            /fileLogger `
            /fileLoggerParameters:"LogFile=$msbuildLog;Verbosity=diagnostic"
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE."
          }

      - name: Upload MSBuild diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-diagnostics
          path: msbuild.log
          if-no-files-found: warn

      - name: Prepare release files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $msix = Get-ChildItem -Path (Join-Path $dist 'msix') -Recurse -Filter *.msix | Select-Object -First 1
          if (-not $msix) { throw 'MSIX package was not produced.' }
          Copy-Item $msix.FullName (Join-Path $dist 'FinderSpan-x64.msix') -Force

          @'
          FinderSpan Windows x64

          INSTALLATION
          1. Double-click FinderSpan-Dev.cer.
          2. Choose Install Certificate -> Local Machine (administrator permission required).
          3. Choose "Place all certificates in the following store" -> Trusted People.
          4. Finish the certificate wizard.
          5. Close any open App Installer window, then double-click FinderSpan-x64.msix and choose Install.

          IMPORTANT: App Installer validates development signing certificates against the Local Machine certificate store. Installing this certificate only for Current User will not make the MSIX trusted.

          The certificate only signs this development build. The private signing key is generated ephemerally by GitHub Actions and is not included in the release.

          FinderSpan is an independent GPL-3.0 fork of SPAN Finder and is not affiliated with Apple Inc.
          '@ | Set-Content -Path (Join-Path $dist 'INSTALL.txt') -Encoding UTF8

          Compress-Archive -Path `
            (Join-Path $dist 'FinderSpan-x64.msix'), `
            (Join-Path $dist 'FinderSpan-Dev.cer'), `
            (Join-Path $dist 'INSTALL.txt') `
            -DestinationPath (Join-Path $dist 'FinderSpan-Windows-x64.zip') -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinderSpan-Windows-x64
          path: |
            dist/FinderSpan-Windows-x64.zip
            dist/FinderSpan-x64.msix
            dist/FinderSpan-Dev.cer
            dist/INSTALL.txt
          if-no-files-found: error

      - name: Move rolling release tag to built commit
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git push --force origin "${env:GITHUB_SHA}:refs/tags/finder-latest"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not move finder-latest tag to $env:GITHUB_SHA."
          }

      - name: Publish rolling prerelease
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: finder-latest
          name: FinderSpan latest
          prerelease: true
          generate_release_notes: false
          body: |
            FinderSpan is an independent Finder-inspired UI fork of SPAN Finder.

            Recommended download: **FinderSpan-Windows-x64.zip**.
            Extract it, install the included `FinderSpan-Dev.cer` into **Local Machine / Trusted People** (administrator permission required), close any open App Installer window, then install `FinderSpan-x64.msix`.

            This is a development-signed sideload build. The private signing key is generated ephemerally for each CI run and is never published.

            GPL-3.0 source is available in this repository.
          files: |
            dist/FinderSpan-Windows-x64.zip
            dist/FinderSpan-x64.msix
            dist/FinderSpan-Dev.cer
            dist/INSTALL.txt
