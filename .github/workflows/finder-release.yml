name: FinderSpan Windows Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/Apply-FinderUi*.ps1'
      - '.github/workflows/finder-release.yml'
      - 'src/Span/**'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Apply FinderSpan UI patch
        shell: pwsh
        run: ./tools/Apply-FinderUi-CI.ps1

      - name: Build signed x64 MSIX
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\dist\msix" | Out-Null
          msbuild src\Span\Span\Span.csproj /restore /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxBundle=Never `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE\dist\msix\"

      - name: Prepare release files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $msix = Get-ChildItem -Path $dist -Recurse -Filter *.msix | Select-Object -First 1
          if (-not $msix) { throw 'MSIX package was not produced.' }
          Copy-Item $msix.FullName (Join-Path $dist 'FinderSpan-x64.msix') -Force
          Compress-Archive -Path (Join-Path $dist 'FinderSpan-x64.msix') -DestinationPath (Join-Path $dist 'FinderSpan-Windows-x64.zip') -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinderSpan-Windows-x64
          path: |
            dist/FinderSpan-Windows-x64.zip
            dist/FinderSpan-x64.msix
          if-no-files-found: error

      - name: Publish rolling prerelease
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: finder-latest
          name: FinderSpan latest
          prerelease: true
          generate_release_notes: false
          body: |
            FinderSpan is an independent Finder-inspired UI fork of SPAN Finder.

            Download FinderSpan-Windows-x64.zip or FinderSpan-x64.msix.
            This is a sideload development build, so Windows may require trusting the package signing certificate before installation.

            GPL-3.0 source is available in this repository.
          files: |
            dist/FinderSpan-Windows-x64.zip
            dist/FinderSpan-x64.msix
