name: Apply FinderSpan v19 integration

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-finderspan-v19.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply product patch
        run: |
          python tools/apply_finderspan_v19.py
          git checkout -- .github/workflows/finder-release.yml
          git checkout -- .github/workflows/apply-finderspan-v19.yml

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: polish Finder UI and integrate ZIP browsing"
          git push
