name: Apply FinderSpan v19 integration

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-finderspan-v19.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply ZIP integration and Finder polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          app = root / 'src/Span/Span/App.xaml.cs'
          manifest = root / 'src/Span/Span/Package.appxmanifest'
          helper = root / 'src/Span/Span/Helpers/ViewItemHelper.cs'
          maincs = root / 'src/Span/Span/MainWindow.xaml.cs'
          zipcs = root / 'src/Span/Span/MainWindow.ZipIntegration.cs'
          home = root / 'src/Span/Span/Views/HomeModeView.xaml'
          ci_patch = root / 'tools/Apply-FinderUi-CI.ps1'
          release = root / '.github/workflows/finder-release.yml'

          def read(p):
              return p.read_text(encoding='utf-8-sig')
          def write(p, s):
              p.write_text(s, encoding='utf-8', newline='\n')

          # ------------------------------------------------------------
          # 1) Register FinderSpan as a real .zip handler in the MSIX.
          # ------------------------------------------------------------
          t = read(manifest)
          if 'windows.fileTypeAssociation' not in t:
              anchor = '''        </uap3:Extension>'''
              if anchor not in t:
                  raise SystemExit('Manifest appExecutionAlias anchor not found')
              assoc = '''        </uap3:Extension>
        <uap:Extension Category="windows.fileTypeAssociation">
          <uap:FileTypeAssociation Name="finderspan-zip">
            <uap:DisplayName>FinderSpan ZIP Archive</uap:DisplayName>
            <uap:SupportedFileTypes>
              <uap:FileType>.zip</uap:FileType>
            </uap:SupportedFileTypes>
          </uap:FileTypeAssociation>
        </uap:Extension>'''
              t = t.replace(anchor, assoc, 1)
          write(manifest, t)

          # ------------------------------------------------------------
          # 2) Details/List/Icon double-click: browse a physical ZIP
          #    instead of handing it to ShellExecute.
          # ------------------------------------------------------------
          t = read(helper)
          if 'Browsing ZIP archive' not in t:
              anchor = '''                    if (ArchivePathHelper.IsArchivePath(file.Path))
                    {
                        MainWindow.OpenArchiveEntryStaticAsync(file.Path);
                        DebugLogger.Log($"[{viewName}] Extracting archive entry {file.Name}");
                    }
                    else if (file.Path.EndsWith(".lnk", StringComparison.OrdinalIgnoreCase))'''
              repl = '''                    if (ArchivePathHelper.IsArchivePath(file.Path))
                    {
                        MainWindow.OpenArchiveEntryStaticAsync(file.Path);
                        DebugLogger.Log($"[{viewName}] Extracting archive entry {file.Name}");
                    }
                    else if (ArchivePathHelper.IsBrowsableArchive(file.Path))
                    {
                        _ = explorer!.NavigateToPath(ArchivePathHelper.Combine(file.Path, string.Empty));
                        DebugLogger.Log($"[{viewName}] Browsing ZIP archive {file.Name}");
                    }
                    else if (file.Path.EndsWith(".lnk", StringComparison.OrdinalIgnoreCase))'''
              if anchor not in t:
                  raise SystemExit('ViewItemHelper archive anchor not found')
              t = t.replace(anchor, repl, 1)
          write(helper, t)

          # ------------------------------------------------------------
          # 3) AppLifecycle file activation, initial and redirected.
          # ------------------------------------------------------------
          t = read(app)
          initial_marker = '                    // Fallback: Environment.GetCommandLineArgs (AppExecutionAlias 대응)'
          if 'Initial file activation' not in t:
              if initial_marker not in t:
                  raise SystemExit('Initial activation fallback marker not found')
              block = '''                    // FinderSpan: Initial file activation (.zip association)
                    if (activatedArgs.Kind == Microsoft.Windows.AppLifecycle.ExtendedActivationKind.File)
                    {
                        var fileData = activatedArgs.Data as Windows.ApplicationModel.Activation.IFileActivatedEventArgs;
                        var storageFile = fileData?.Files?.OfType<Windows.Storage.StorageFile>().FirstOrDefault();
                        if (storageFile != null && Helpers.ArchivePathHelper.IsBrowsableArchive(storageFile.Path))
                        {
                            StartupArguments = storageFile.Path;
                            Helpers.DebugLogger.Log($"[App] File activation ZIP: {storageFile.Path}");
                        }
                    }

'''
              t = t.replace(initial_marker, block + initial_marker, 1)

          redirected_marker = '                // UI 스레드에서 처리'
          if 'Redirected file activation' not in t:
              if redirected_marker not in t:
                  raise SystemExit('Redirected activation UI marker not found')
              block = '''                // FinderSpan: Redirected file activation (.zip association)
                if (args.Kind == ExtendedActivationKind.File)
                {
                    var fileData = args.Data as Windows.ApplicationModel.Activation.IFileActivatedEventArgs;
                    var storageFile = fileData?.Files?.OfType<Windows.Storage.StorageFile>().FirstOrDefault();
                    if (storageFile != null)
                        folderPath = storageFile.Path;
                }

'''
              t = t.replace(redirected_marker, block + redirected_marker, 1)
          write(app, t)

          # ------------------------------------------------------------
          # 4) Route external/startup ZIP files into archive://.
          # ------------------------------------------------------------
          t = read(maincs)
          if 'HandleRedirectedArchive(filePath)' not in t:
              anchor = '''        internal void HandleRedirectedFile(string filePath)
        {
            if (_isClosed || ViewModel == null) return;'''
              repl = '''        internal void HandleRedirectedFile(string filePath)
        {
            if (_isClosed || ViewModel == null) return;
            if (Helpers.ArchivePathHelper.IsBrowsableArchive(filePath))
            {
                HandleRedirectedArchive(filePath);
                return;
            }'''
              if anchor not in t:
                  raise SystemExit('HandleRedirectedFile anchor not found')
              t = t.replace(anchor, repl, 1)

          if '[Startup] ZIP archive argument' not in t:
              anchor = '''                            else if (System.IO.File.Exists(jumpArg))
                            {
                                // 파일 경로 → 부모 폴더 열고 파일 선택'''
              repl = '''                            else if (System.IO.File.Exists(jumpArg) && Helpers.ArchivePathHelper.IsBrowsableArchive(jumpArg))
                            {
                                Helpers.DebugLogger.Log($"[Startup] ZIP archive argument: {jumpArg}");
                                HandleRedirectedArchive(jumpArg, createNewTab: false);
                            }
                            else if (System.IO.File.Exists(jumpArg))
                            {
                                // 파일 경로 → 부모 폴더 열고 파일 선택'''
              if anchor not in t:
                  raise SystemExit('Startup physical file branch anchor not found')
              t = t.replace(anchor, repl, 1)
          write(maincs, t)

          zip_source = '''using System;
using Span.Helpers;
using Span.Models;

namespace Span
{
    public sealed partial class MainWindow
    {
        /// <summary>
        /// Opens a physical ZIP as a read-only archive:// folder. The archive engine and
        /// provider already exist upstream; this method connects Windows/file activation
        /// to that real navigation path without extracting the whole archive first.
        /// </summary>
        internal void HandleRedirectedArchive(string archivePath, bool createNewTab = true)
        {
            if (_isClosed || ViewModel == null || !ArchivePathHelper.IsBrowsableArchive(archivePath))
                return;

            try
            {
                if (createNewTab)
                {
                    ViewModel.AddNewTab();
                    if (ViewModel.ActiveTab != null)
                    {
                        CreateMillerPanelForTab(ViewModel.ActiveTab);
                        SwitchMillerPanel(ViewModel.ActiveTab.Id);
                    }
                }

                if (ViewModel.CurrentViewMode == ViewMode.Home ||
                    ViewModel.CurrentViewMode == ViewMode.RecycleBin)
                {
                    ViewModel.SwitchViewMode(ViewModel.ResolveViewModeFromHome());
                }

                UpdateViewModeVisibility();
                ResubscribeLeftExplorer();

                var archiveRoot = new FolderItem
                {
                    Name = System.IO.Path.GetFileName(archivePath),
                    Path = ArchivePathHelper.Combine(archivePath, string.Empty)
                };

                _ = ViewModel.ActiveExplorer?.NavigateTo(archiveRoot);
                FocusActiveView();
                Helpers.DebugLogger.Log($"[FinderSpan ZIP] Browsing {archivePath}");
            }
            catch (Exception ex)
            {
                Helpers.DebugLogger.Log($"[FinderSpan ZIP] Activation error: {ex.Message}");
            }
        }
    }
}
'''
          write(zipcs, zip_source)

          # ------------------------------------------------------------
          # 5) Finder-like Home. Same data/handlers, no giant dashboard cards.
          # ------------------------------------------------------------
          home_source = '''<UserControl
    x:Class="Span.Views.HomeModeView"
    xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"
    xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml"
    xmlns:d="http://schemas.microsoft.com/expression/blend/2008"
    xmlns:mc="http://schemas.openxmlformats.org/markup-compatibility/2006"
    xmlns:models="using:Span.Models"
    xmlns:helpers="using:Span.Helpers"
    mc:Ignorable="d">

    <UserControl.Resources>
        <Style x:Key="FinderHomeListItemStyle" TargetType="ListViewItem">
            <Setter Property="Padding" Value="0"/>
            <Setter Property="Margin" Value="0"/>
            <Setter Property="MinHeight" Value="0"/>
            <Setter Property="HorizontalContentAlignment" Value="Stretch"/>
            <Setter Property="Background" Value="Transparent"/>
        </Style>
    </UserControl.Resources>

    <ScrollViewer VerticalScrollBarVisibility="Auto" HorizontalScrollBarVisibility="Disabled"
                  Background="#FFFFFF">
        <StackPanel x:Name="RootPanel" Padding="28,22,34,32" Spacing="18">

            <StackPanel Spacing="7">
                <TextBlock x:Name="DevicesHeader" Text="Devices and drives"
                           FontSize="11" FontWeight="SemiBold" Foreground="#777777" Margin="6,0,0,0"/>
                <Border Background="#FBFBFB" BorderBrush="#E2E2E2" BorderThickness="1" CornerRadius="9">
                    <ListView x:Name="DrivesGridView" ItemsSource="{x:Bind LocalDrives, Mode=OneWay}"
                              IsItemClickEnabled="True" ItemClick="OnDriveItemClick" SelectionMode="None"
                              ItemContainerStyle="{StaticResource FinderHomeListItemStyle}">
                        <ListView.ItemTemplate>
                            <DataTemplate x:DataType="models:DriveItem">
                                <Grid MinHeight="50" Padding="12,6" RightTapped="OnDriveRightTapped">
                                    <Grid.ColumnDefinitions>
                                        <ColumnDefinition Width="34"/><ColumnDefinition Width="*"/><ColumnDefinition Width="190"/><ColumnDefinition Width="20"/>
                                    </Grid.ColumnDefinitions>
                                    <FontIcon Grid.Column="0" FontFamily="{StaticResource RemixIcons}" Glyph="{x:Bind IconGlyph}"
                                              FontSize="21" Foreground="{ThemeResource SpanAccentBrush}" VerticalAlignment="Center"/>
                                    <StackPanel Grid.Column="1" VerticalAlignment="Center" Spacing="1">
                                        <TextBlock Text="{x:Bind Name}" FontSize="13" FontWeight="SemiBold" TextTrimming="CharacterEllipsis"/>
                                        <TextBlock Text="{x:Bind SizeDescription}" FontSize="10" Foreground="#8A8A8A" TextTrimming="CharacterEllipsis"/>
                                    </StackPanel>
                                    <ProgressBar Grid.Column="2" Value="{x:Bind UsagePercent}" Maximum="100" Height="4" CornerRadius="2"
                                                 VerticalAlignment="Center" Margin="14,0,12,0"/>
                                    <FontIcon Grid.Column="3" Glyph="&#xE76C;" FontSize="10" Foreground="#A0A0A0" VerticalAlignment="Center"/>
                                </Grid>
                            </DataTemplate>
                        </ListView.ItemTemplate>
                    </ListView>
                </Border>
            </StackPanel>

            <StackPanel x:Name="CloudSection" Spacing="7" Visibility="{x:Bind HasCloudDrives}">
                <TextBlock x:Name="CloudHeader" Text="Cloud storage"
                           FontSize="11" FontWeight="SemiBold" Foreground="#777777" Margin="6,0,0,0"/>
                <Border Background="#FBFBFB" BorderBrush="#E2E2E2" BorderThickness="1" CornerRadius="9">
                    <ListView x:Name="CloudDrivesGridView" ItemsSource="{x:Bind CloudDrivesList, Mode=OneWay}"
                              IsItemClickEnabled="True" ItemClick="OnDriveItemClick" SelectionMode="None"
                              ItemContainerStyle="{StaticResource FinderHomeListItemStyle}">
                        <ListView.ItemTemplate>
                            <DataTemplate x:DataType="models:DriveItem">
                                <Grid MinHeight="46" Padding="12,5" RightTapped="OnDriveRightTapped">
                                    <Grid.ColumnDefinitions><ColumnDefinition Width="34"/><ColumnDefinition Width="*"/><ColumnDefinition Width="20"/></Grid.ColumnDefinitions>
                                    <FontIcon Grid.Column="0" FontFamily="{StaticResource RemixIcons}" Glyph="{x:Bind IconGlyph}"
                                              FontSize="20" Foreground="{ThemeResource SpanAccentBrush}" VerticalAlignment="Center"/>
                                    <StackPanel Grid.Column="1" VerticalAlignment="Center" Spacing="1">
                                        <TextBlock Text="{x:Bind Name}" FontSize="13" FontWeight="SemiBold" TextTrimming="CharacterEllipsis"/>
                                        <TextBlock Text="{x:Bind SizeDescription}" FontSize="10" Foreground="#8A8A8A" TextTrimming="CharacterEllipsis"
                                                   Visibility="{x:Bind helpers:VisibilityHelper.FromNonEmpty(SizeDescription)}"/>
                                    </StackPanel>
                                    <FontIcon Grid.Column="2" Glyph="&#xE76C;" FontSize="10" Foreground="#A0A0A0" VerticalAlignment="Center"/>
                                </Grid>
                            </DataTemplate>
                        </ListView.ItemTemplate>
                    </ListView>
                </Border>
            </StackPanel>

            <StackPanel x:Name="NetworkSection" Spacing="7" Visibility="{x:Bind HasNetworkDrives}">
                <TextBlock x:Name="NetworkHeader" Text="Network locations"
                           FontSize="11" FontWeight="SemiBold" Foreground="#777777" Margin="6,0,0,0"/>
                <Border Background="#FBFBFB" BorderBrush="#E2E2E2" BorderThickness="1" CornerRadius="9">
                    <ListView x:Name="NetworkDrivesGridView" ItemsSource="{x:Bind NetworkDrivesList, Mode=OneWay}"
                              IsItemClickEnabled="True" ItemClick="OnDriveItemClick" SelectionMode="None"
                              ItemContainerStyle="{StaticResource FinderHomeListItemStyle}">
                        <ListView.ItemTemplate>
                            <DataTemplate x:DataType="models:DriveItem">
                                <Grid MinHeight="46" Padding="12,5" RightTapped="OnDriveRightTapped">
                                    <Grid.ColumnDefinitions><ColumnDefinition Width="34"/><ColumnDefinition Width="*"/><ColumnDefinition Width="20"/></Grid.ColumnDefinitions>
                                    <FontIcon Grid.Column="0" FontFamily="{StaticResource RemixIcons}" Glyph="{x:Bind IconGlyph}"
                                              FontSize="20" Foreground="#6E6E6E" VerticalAlignment="Center"/>
                                    <StackPanel Grid.Column="1" VerticalAlignment="Center" Spacing="1">
                                        <TextBlock Text="{x:Bind Name}" FontSize="13" FontWeight="SemiBold" TextTrimming="CharacterEllipsis"/>
                                        <TextBlock Text="{x:Bind SizeDescription}" FontSize="10" Foreground="#8A8A8A" TextTrimming="CharacterEllipsis"
                                                   Visibility="{x:Bind helpers:VisibilityHelper.FromNonEmpty(SizeDescription)}"/>
                                    </StackPanel>
                                    <FontIcon Grid.Column="2" Glyph="&#xE76C;" FontSize="10" Foreground="#A0A0A0" VerticalAlignment="Center"/>
                                </Grid>
                            </DataTemplate>
                        </ListView.ItemTemplate>
                    </ListView>
                </Border>
            </StackPanel>

            <StackPanel Spacing="7">
                <TextBlock x:Name="FavoritesHeader" Text="Favorites"
                           FontSize="11" FontWeight="SemiBold" Foreground="#777777" Margin="6,0,0,0"/>
                <Border Background="#FBFBFB" BorderBrush="#E2E2E2" BorderThickness="1" CornerRadius="9">
                    <ListView x:Name="FavoritesGridView" ItemsSource="{x:Bind Favorites, Mode=OneWay}"
                              IsItemClickEnabled="True" ItemClick="OnFavoriteItemClick"
                              ContainerContentChanging="OnFavoriteContainerContentChanging" SelectionMode="None"
                              ItemContainerStyle="{StaticResource FinderHomeListItemStyle}">
                        <ListView.ItemTemplate>
                            <DataTemplate x:DataType="models:FavoriteItem">
                                <Grid MinHeight="44" Padding="12,4" RightTapped="OnFavoriteRightTapped">
                                    <Grid.ColumnDefinitions><ColumnDefinition Width="34"/><ColumnDefinition Width="*"/><ColumnDefinition Width="20"/></Grid.ColumnDefinitions>
                                    <Grid Grid.Column="0" Width="20" Height="20" VerticalAlignment="Center" HorizontalAlignment="Left">
                                        <Image Source="{x:Bind CustomIcon, Mode=OneWay}" Visibility="{x:Bind CustomIconVisibility, Mode=OneWay}" Width="20" Height="20"/>
                                        <FontIcon FontFamily="{StaticResource RemixIcons}" Glyph="{x:Bind IconGlyph}" Foreground="{x:Bind IconBrush}"
                                                  FontSize="19" Visibility="{x:Bind GlyphVisibility, Mode=OneWay}"/>
                                    </Grid>
                                    <TextBlock Grid.Column="1" Text="{x:Bind Name}" FontSize="13" VerticalAlignment="Center" TextTrimming="CharacterEllipsis"/>
                                    <FontIcon Grid.Column="2" Glyph="&#xE76C;" FontSize="10" Foreground="#A0A0A0" VerticalAlignment="Center"/>
                                </Grid>
                            </DataTemplate>
                        </ListView.ItemTemplate>
                    </ListView>
                </Border>
            </StackPanel>
        </StackPanel>
    </ScrollViewer>
</UserControl>
'''
          write(home, home_source)

          # ------------------------------------------------------------
          # 6) Second visual pass on generated Finder skin.
          # ------------------------------------------------------------
          t = read(ci_patch)
          marker = '# FinderSpan v19 presentation-only polish'
          if marker not in t:
              t += r'''

# FinderSpan v19 presentation-only polish
# Keep every real handler/data source. Only refine geometry and appearance.
$t = ReadText $main
$t = $t.Replace('<ColumnDefinition x:Name="SidebarCol" Width="244"/>','<ColumnDefinition x:Name="SidebarCol" Width="236"/>')
$t = $t.Replace('Background="#FFFFFF"', 'Background="#F3F3F3"', 1)
$t = $t.Replace('<Grid x:Name="FinderToolbar" Grid.Row="0" Height="{StaticResource CommandBarHeight}" Background="#EFEFEF" BorderBrush="#C9C9C9"', '<Grid x:Name="FinderToolbar" Grid.Row="0" Height="50" Background="#F4F4F4" BorderBrush="#D8D8D8"')
$t = $t.Replace('<Grid x:Name="AppTitleBar" Grid.Row="1" Height="{StaticResource TitleBarHeight}" Background="#EFEFEF"', '<Grid x:Name="AppTitleBar" Grid.Row="1" Height="{StaticResource TitleBarHeight}" Background="#F4F4F4"')
$t = $t.Replace('<Grid Height="34" VerticalAlignment="Bottom"', '<Grid Height="30" Margin="2,2,0,2" VerticalAlignment="Center"')
$t = $t.Replace('Background="{ThemeResource SpanBgLayer1Brush}"\r\n                                            CornerRadius="6,6,0,0"', 'Background="#FFFFFF"\r\n                                            CornerRadius="7"')
$t = $t.Replace('BorderBrush="{ThemeResource SpanAccentDimBrush}"\r\n                                            BorderThickness="1" CornerRadius="6,6,0,0"', 'BorderBrush="#D8D8D8"\r\n                                            BorderThickness="0" CornerRadius="7"')
$t = $t.Replace('BorderBrush="{ThemeResource SpanAccentDimBrush}"\r\n                                            BorderThickness="1,1,1,0" CornerRadius="6,6,0,0"', 'BorderBrush="#D0D0D0"\r\n                                            BorderThickness="1" CornerRadius="7"')
$t = $t.Replace('Width="34" Height="34" VerticalAlignment="Bottom"', 'Width="30" Height="30" VerticalAlignment="Center"')
$t = $t.Replace('<Grid Height="27" Margin="3,1" Padding="8,0" Background="Transparent"', '<Grid Height="27" Margin="3,1" Padding="8,0" CornerRadius="5" Background="Transparent"')
$t = $t.Replace('<Grid Height="26" Margin="3,1" Padding="8,0,6,0"', '<Grid Height="26" Margin="3,1" Padding="8,0,6,0" CornerRadius="5"')
WriteText $main $t

# Details/List semantics must remain truthful: Name / Date Modified / Kind / Size.
$t = ReadText $details
$t = [regex]::Replace($t, '(<Button x:Name="TypeHeaderButton"\s+)Content="[^"]+"([\s\S]*?)Tag="[^"]+"', '$1Content="Kind"$2Tag="Type"', 1)
$t = [regex]::Replace($t, '(<Button x:Name="SizeHeaderButton"\s+)Content="[^"]+"([\s\S]*?)Tag="[^"]+"', '$1Content="Size"$2Tag="Size"', 1)
$t = $t.Replace('Background="#F8F8F8"','Background="#FAFAFA"')
$t = $t.Replace('BorderBrush="#D5D5D5"','BorderBrush="#E1E1E1"')
WriteText $details $t

$t = ReadText $detailsCs
$t = [regex]::Replace($t, 'TypeHeaderButton\.Content\s*=\s*[^;]+;\s*SizeHeaderButton\.Content\s*=\s*[^;]+;', 'TypeHeaderButton.Content = "Kind";`r`n            SizeHeaderButton.Content = _loc.Get("Size");', 1)
$t = $t.Replace('TypeHeaderButton.Content = "Kind";`r`n            SizeHeaderButton.Content = _loc.Get("Size");', "TypeHeaderButton.Content = `"Kind`";`r`n            SizeHeaderButton.Content = _loc.Get(`"Size`");")
WriteText $detailsCs $t
'''
          write(ci_patch, t)

          # ------------------------------------------------------------
          # 7) Release must validate the new functionality and be a normal release.
          # ------------------------------------------------------------
          t = read(release)
          if '$zipIntegrationPath' not in t:
              anchor = '''          $chromePath = Join-Path $env:GITHUB_WORKSPACE 'src\\Span\\Span\\MainWindow.FinderChrome.cs'
          $xaml = Get-Content -LiteralPath $xamlPath -Raw
          $chrome = Get-Content -LiteralPath $chromePath -Raw'''
              repl = '''          $chromePath = Join-Path $env:GITHUB_WORKSPACE 'src\\Span\\Span\\MainWindow.FinderChrome.cs'
          $manifestCheckPath = Join-Path $env:GITHUB_WORKSPACE 'src\\Span\\Span\\Package.appxmanifest'
          $viewItemPath = Join-Path $env:GITHUB_WORKSPACE 'src\\Span\\Span\\Helpers\\ViewItemHelper.cs'
          $appCheckPath = Join-Path $env:GITHUB_WORKSPACE 'src\\Span\\Span\\App.xaml.cs'
          $zipIntegrationPath = Join-Path $env:GITHUB_WORKSPACE 'src\\Span\\Span\\MainWindow.ZipIntegration.cs'
          $homeCheckPath = Join-Path $env:GITHUB_WORKSPACE 'src\\Span\\Span\\Views\\HomeModeView.xaml'
          $xaml = Get-Content -LiteralPath $xamlPath -Raw
          $chrome = Get-Content -LiteralPath $chromePath -Raw
          $manifestCheck = Get-Content -LiteralPath $manifestCheckPath -Raw
          $viewItem = Get-Content -LiteralPath $viewItemPath -Raw
          $appCheck = Get-Content -LiteralPath $appCheckPath -Raw
          $zipIntegration = Get-Content -LiteralPath $zipIntegrationPath -Raw
          $homeCheck = Get-Content -LiteralPath $homeCheckPath -Raw'''
              if anchor not in t:
                  raise SystemExit('Release validation variable anchor not found')
              t = t.replace(anchor, repl, 1)

              marker = "          Write-Host 'FinderSpan integration validation passed: real sidebar retained, fake AirDrop/Tags removed, Quick Share wired.'"
              extra = '''          foreach ($required in @('windows.fileTypeAssociation','<uap:FileType>.zip</uap:FileType>')) {
            if (-not $manifestCheck.Contains($required)) { throw "ZIP manifest integration missing: $required" }
          }
          if (-not $viewItem.Contains('ArchivePathHelper.IsBrowsableArchive(file.Path)')) { throw 'ZIP browsing is not wired into Details/List/Icon opening.' }
          if (-not $appCheck.Contains('ExtendedActivationKind.File')) { throw 'Windows file activation handling is missing.' }
          if (-not $zipIntegration.Contains('HandleRedirectedArchive')) { throw 'ZIP activation bridge is missing.' }
          if ($homeCheck.Contains('Width="220" Height="80"')) { throw 'Legacy dashboard-card Home layout returned.' }

          Write-Host 'FinderSpan v19 validation passed: real sidebar, Quick Share, compact Home and ZIP browsing/file association are wired.' '''
              if marker not in t:
                  raise SystemExit('Release validation final marker not found')
              t = t.replace(marker, extra, 1)

          t = t.replace('- name: Publish rolling prerelease', '- name: Publish rolling release')
          t = t.replace('          prerelease: true', '          prerelease: false')

          install_anchor = '''          5. Close any open App Installer window, then double-click FinderSpan-x64.msix and choose Install.

          IMPORTANT:'''
          install_repl = '''          5. Close any open App Installer window, then double-click FinderSpan-x64.msix and choose Install.

          ZIP FILES
          FinderSpan registers itself as a handler for .zip archives and can browse ZIP contents without extracting the whole archive first.
          Windows does not allow apps to silently steal default file associations. After installation, choose FinderSpan once in Open with -> Choose another app -> Always, or Settings -> Apps -> Default apps -> .zip.

          IMPORTANT:'''
          if install_anchor not in t:
              raise SystemExit('INSTALL.txt body anchor not found')
          t = t.replace(install_anchor, install_repl, 1)

          release_body_anchor = '''            This is a development-signed sideload build. The private signing key is generated ephemerally for each CI run and is never published.'''
          release_body_repl = '''            This build includes the compact Finder-style Home/sidebar polish and read-only in-app ZIP browsing. FinderSpan registers as a `.zip` handler; Windows may ask you to select it once as the default app for ZIP files.

            This is a development-signed sideload build. The private signing key is generated ephemerally for each CI run and is never published.'''
          if release_body_anchor not in t:
              raise SystemExit('Release body anchor not found')
          t = t.replace(release_body_anchor, release_body_repl, 1)
          write(release, t)

          # Remove this one-shot mutator from the resulting repository.
          Path('.github/workflows/apply-finderspan-v19.yml').unlink()
          PY

      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: polish Finder UI and integrate ZIP browsing"
          git push

      - name: Dispatch release build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run finder-release.yml --ref main
